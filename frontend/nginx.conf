# EcoSort frontend - production server.
# Installed at /etc/nginx/conf.d/default.conf by frontend/Dockerfile (target: prod).

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Uploaded images reach the API as base64 data URLs inside a JSON body; the backend
    # caps them at MAX_IMAGE_DATA_URL (400000 chars), so 8m leaves generous headroom
    # without letting nginx buffer arbitrarily large bodies.
    client_max_body_size 8m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Weight shards are already-compressed binary blobs; re-compressing wastes CPU.
    gzip_disable "msie6";

    # ---------------------------------------------------------------------
    # API + model files: same-origin proxy to the backend, so the browser
    # never needs CORS and the app only ever uses relative URLs.
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    location /models/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;

        # Model weights are ~14 MB; streaming them avoids buffering the lot to disk.
        proxy_buffering    off;
    }

    # ---------------------------------------------------------------------
    # Static assets
    # ---------------------------------------------------------------------

    # Vite emits content-hashed filenames here, so they are safe to cache forever.
    location /assets/ {
        try_files  $uri =404;
        # add_header alone, without `expires`, so exactly one Cache-Control is emitted.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # The entry point must never be cached, or clients pin themselves to a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
    }

    # SPA fallback: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
